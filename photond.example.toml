[node]
rpc_url = "http://127.0.0.1:8332"
# "cookie:<path to .cookie>", "env:<VAR>" with user:password inside, or "user:password"
auth = "cookie:/var/lib/bitcoind/.cookie"
poll_ms = 100

[pool]
network = "mainnet"        # mainnet, testnet or regtest
mode = "pplns"             # "solo": the finder is paid directly; "pplns": reward split in the coinbase
address = "bc1q..."        # pool fee and remainder address
stratum_listen = "0.0.0.0:3333"
coinbase_tag = "/photonpool/"
refresh_secs = 30
max_connections = 20000
# Must equal bitcoind -blockreservedweight (default 8000 since Bitcoin Core 30, about 40 outputs); raise both for more outputs.
coinbase_reserved_weight = 8000

[difficulty]
start = 1024
min = 1
max = 1.0e12
target_share_secs = 10

[pplns]
window_factor = 2.0        # window size in multiples of the network difficulty
fee_percent = 1.0
max_outputs = 200          # upper limit of miner outputs per coinbase, further capped by coinbase_reserved_weight
dust_sats = 1000

[ledger]
path = "photond.db"

[http]
# Web page and API (pool, engine and miner views, JSON under /public/v1). Empty listen disables it.
# Binds to localhost by default: put a reverse proxy with TLS in front to publish it.
listen = "127.0.0.1:8080"
name = "photon"
stratum_host = ""                      # host shown in the stratum URL; empty uses the host of the page
explorer_url = "https://mempool.space" # block links; empty for none
music_dir = "music"                    # audio files and playlist.json for the player
rate_per_min = 300
trust_proxy = false                    # true only behind a reverse proxy you control (X-Forwarded-For)
